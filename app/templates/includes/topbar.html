<header class="d-flex flex-wrap justify-content-between py-3 mb-4 border-bottom shadow-sm bg-white mt-3 rounded px-3">
    <div class="d-flex align-items-center mb-3 mb-md-0 text-dark text-decoration-none">
        <span class="fs-5 fw-bold text-primary"><i class="bi bi-grid-1x2-fill me-2"></i> Painel de Controle</span>
    </div>
    
    <div class="d-flex align-items-center">
        <span class="me-3 fw-semibold text-dark">
            <i class="bi bi-person-circle text-secondary me-1"></i> 
            
            {% if user.is_authenticated %}
                {% if user.role == 'PROFISSIONAL' %}Dr(a). {% endif %}
                {{ user.full_name|default:user.email }}
            {% else %}
                Visitante
            {% endif %}
        </span>
        {% if user.is_authenticated %}
            <form method="post" action="{% url 'logout' %}" class="d-inline">
                {% csrf_token %}
                <button type="submit" class="btn btn-outline-danger btn-sm shadow-sm fw-bold">
                    <i class="bi bi-box-arrow-right me-1"></i> Sair
                </button>
            </form>
        {% endif %}
    </div>
</header>
